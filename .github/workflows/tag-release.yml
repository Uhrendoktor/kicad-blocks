name: Tag verified release

permissions:
  contents: write
  actions: write

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Create a version tag only after the main-branch KiCad CI run has completed green.
concurrency:
  group: kicad-blocks-tag-release
  cancel-in-progress: false

jobs:
  tag-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Check out the exact CI-tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create the version tag without moving any existing release tag
        shell: bash
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^1\.1\.[0-9]+$ ]]; then
            echo "No automatic V1.1 tag is configured for VERSION=$VERSION."
            exit 0
          fi
          TAG="v$VERSION"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" origin/main

          if git ls-remote --exit-code --refs --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            existing="$(git rev-list -n 1 "$TAG")"
            if ! git merge-base --is-ancestor "$existing" "$RELEASE_SOURCE_SHA"; then
              echo "::error::Existing $TAG target $existing is not an ancestor of the CI-tested main commit."
              exit 1
            fi
            echo "$TAG already exists at $existing; it will not be moved."
            python3 scripts/dispatch_release.py \
              --repo "$GITHUB_REPOSITORY" \
              --tag "$TAG" \
              --source-sha "$existing" \
              --version "$VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$RELEASE_SOURCE_SHA" -m "KiCad Blocks $VERSION"
          git push origin "refs/tags/$TAG"
          python3 scripts/dispatch_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --version "$VERSION"
