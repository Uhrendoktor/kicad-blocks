name: Release

permissions:
  contents: write
  actions: read

on:
  push:
    tags:
      - "v1.*"

# Release publication is intentionally serial and tied to an exact version tag.
concurrency:
  group: kicad-blocks-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version tag and exact successful main CI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $VERSION."
            exit 1
          fi
          python3 scripts/verify_release_gate.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA" \
            --version-file VERSION
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test and build the release archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_release_package.py
          python3 scripts/build_release.py --output-dir dist --commit "$GITHUB_SHA"
          ARCHIVE="$(find dist -maxdepth 1 -type f -name 'kicad-blocks-*.zip' -print -quit)"
          CHECKSUM="$ARCHIVE.sha256"
          test -n "$ARCHIVE"
          test -f "$CHECKSUM"
          (cd dist && sha256sum --check "$(basename "$CHECKSUM")")
          python3 - "$ARCHIVE" <<'PY'
          import sys
          from zipfile import ZipFile
          with ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
          assert any(name.endswith("/plugin/kicad-blocks/plugin.json") for name in names)
          assert any(name.endswith("/scripts/install_plugin.py") for name in names)
          PY

      - name: Publish versioned release ZIP and checksum
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          python3 scripts/publish_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "$VERSION" \
            --source-sha "$GITHUB_SHA" \
            --changelog CHANGELOG.md \
            dist/*.zip dist/*.zip.sha256
