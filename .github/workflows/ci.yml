name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-and-kicad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad CLI
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
      - name: Install Python checks
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint, test and compile
        run: |
          ruff check plugin tests
          pytest -q
          python -m compileall -q plugin tests
      - name: Validate generated files with KiCad
        run: python tests/validate_kicad_cli.py
