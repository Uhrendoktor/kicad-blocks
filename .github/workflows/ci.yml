name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest pending validation for each ref. This runner is local
# and serial; stale commit snapshots must not build an unbounded queue.
concurrency:
  group: kicad-blocks-${{ github.ref }}
  cancel-in-progress: true

# The runner is owned by the repository maintainer. Do not execute fork PR code
# on it: only pull requests whose head branch is in this repository are eligible.
jobs:
  python-and-kicad:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad development CLI if missing
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the development build because the plugin targets the newer
          # KiCad schematic IPC API. It is installed inside the self-hosted
          # runner container, not on a GitHub-hosted VM.
          CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          if [[ -z "$CLI" ]]; then
            if [[ "$(id -u)" -eq 0 ]]; then
              SUDO=()
            elif command -v sudo >/dev/null 2>&1 && sudo -n true; then
              SUDO=(sudo)
            else
              echo "::error::KiCad CLI is missing and this self-hosted runner has no non-interactive package-install privilege. Install kicad-nightly on the runner image or grant the runner container package-install access."
              exit 1
            fi
            "${SUDO[@]}" apt-get update
            "${SUDO[@]}" apt-get install -y --no-install-recommends software-properties-common
            "${SUDO[@]}" add-apt-repository --yes ppa:kicad/kicad-dev-nightly
            "${SUDO[@]}" apt-get update
            "${SUDO[@]}" apt-get install -y --no-install-recommends kicad-nightly
            CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          fi
          if [[ -z "$CLI" ]]; then
            echo "::error::KiCad CLI package installed but no kicad-cli executable was found."
            exit 1
          fi
          echo "KICAD_CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" version

      - name: Inspect local runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: $(uname -a)"
          python3 --version
          echo "KiCad CLI: $KICAD_CLI"

      - name: Resolve KiCad Python IPC binding revision
        id: kipy
        shell: bash
        run: |
          set -euo pipefail
          KIPY_SHA="$(git ls-remote https://gitlab.com/kicad/code/kicad-python.git refs/heads/main | cut -f1)"
          if [[ -z "$KIPY_SHA" ]]; then
            echo "::error::Could not resolve official kicad-python main branch."
            exit 1
          fi
          echo "sha=$KIPY_SHA" >> "$GITHUB_OUTPUT"
          echo "Using kicad-python commit $KIPY_SHA"

      - name: Restore cached KiCad Python IPC wheels
        id: kipy-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kicad-blocks-wheelhouse
          key: kicad-python-${{ runner.os }}-${{ runner.arch }}-py312-${{ steps.kipy.outputs.sha }}

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/kicad-blocks-venv"
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install pytest ruff
          "$PY" --version
          "$PY" -m pip --version

      - name: Build KiCad Python IPC wheels
        id: kipy-wheel
        shell: bash
        env:
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse"
          mkdir -p "$WHEELHOUSE"
          if compgen -G "$WHEELHOUSE/kicad_python-*.whl" >/dev/null; then
            echo "Using cached KiCad Python wheel:"
            ls -lh "$WHEELHOUSE"/kicad_python-*.whl
          else
            echo "Building official kicad-python commit $KIPY_SHA"
            "$PY" -m pip wheel --wheel-dir "$WHEELHOUSE" \
              "git+https://gitlab.com/kicad/code/kicad-python.git@$KIPY_SHA"
          fi
          test -n "$(find "$WHEELHOUSE" -maxdepth 1 -name 'kicad_python-*.whl' -print -quit)"
          echo "wheelhouse_ready=true" >> "$GITHUB_OUTPUT"
          du -sh "$WHEELHOUSE"

      - name: Save KiCad Python IPC wheel cache
        if: always() && steps.kipy-wheel.outcome == 'success' && steps.kipy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kicad-blocks-wheelhouse
          key: kicad-python-${{ runner.os }}-${{ runner.arch }}-py312-${{ steps.kipy.outputs.sha }}

      - name: Install KiCad Python IPC bindings
        shell: bash
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse"
          "$PY" -m pip install --no-index --find-links "$WHEELHOUSE" "kicad-python==0.9.0.dev0"
          "$PY" -c "from kipy import KiCad; from kipy.schematic import Schematic; print('Schematic IPC bindings available')"

      - name: Run unit tests and compile
        shell: bash
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          "$PY" -m pytest -q
          "$PY" -m compileall -q plugin tests

      - name: Ruff lint
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python -m ruff check plugin tests"

      - name: Validate generated files with KiCad
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/validate_kicad_cli.py"

      - name: Verify real KiCad IPC placement (headless)
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/test_ipc_headless.py"
