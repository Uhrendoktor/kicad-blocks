name: CI

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main, agents/strict-test-quality-contract-rebased]
  pull_request:

# Keep only the newest validation for each ref. Older commit snapshots are
# cancelled so CI time is spent on the current branch head.
concurrency:
  group: kicad-blocks-${{ github.ref }}
  cancel-in-progress: true

# Run the complete KiCad integration suite on a GitHub-hosted Linux runner.
# Fork PRs remain excluded because this job uses repository write permissions.
jobs:
  synchronize-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main into the quality PR branch
        id: sync
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "updated=false" >> "$GITHUB_OUTPUT"
          if [[ "$REF_NAME" != "agents/strict-test-quality-contract-rebased" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "The PR head already contains current main."
            exit 0
          fi
          echo "::notice::Merging current main into $REF_NAME."
          # Prefer the PR's validated source-side fixes for overlapping hunks.
          # Current-main additions are still merged normally everywhere else;
          # follow up by restoring any additive UI contract/test coverage from main.
          if git merge -X ours --no-commit --no-ff origin/main; then
            # Retain current-main compatibility evidence and catalog regressions,
            # while using the PR's typed public S-expression accessors.
            git checkout origin/main -- docs/explanation/compatibility.md tests/test_extraction.py
            python - <<'PY'
          from pathlib import Path
          import re

          extraction = Path("tests/test_extraction.py")
          source = extraction.read_text(encoding="utf-8")
          source = source.replace(
              "from kicad_blocks.pcb_layout import _all, _direct, _dump, _head, parse_sexpr",
              """from kicad_blocks.sexpr import (
              SExprList,
              dump_sexpr as _dump,
              parse_sexpr,
              sexpr_all as _all,
              sexpr_direct as _direct,
              sexpr_head as _head,
          )""",
          )
          marker = "\n\ndef _source_sheet"
          helper = (
              "\n\n"
              "def _required_direct(node: SExprList, tag: str) -> SExprList:\n"
              "    child = _direct(node, tag)\n"
              "    if child is None:\n"
              "        raise AssertionError(f'Expected a direct {tag!r} node.')\n"
              "    return child\n"
          )
          if "_required_direct(" not in source:
              if marker not in source:
                  raise SystemExit("Could not locate the extraction test helper insertion point.")
              source = source.replace(marker, helper + marker, 1)

          replacements = {
              'str(_direct(_direct(implementation, "sheet_instances"), "path")[1])':
                  'str(_required_direct(_required_direct(implementation, "sheet_instances"), "path")[1])',
              'instances = _direct(resistor, "instances")':
                  'instances = _required_direct(resistor, "instances")',
              'str(_direct(path, "reference")[1])':
                  'str(_required_direct(path, "reference")[1])',
              'stroke = _direct(rectangle, "stroke")':
                  'stroke = _required_direct(rectangle, "stroke")',
              'width = _direct(stroke, "width")':
                  'width = _required_direct(stroke, "width")',
              '_direct(_direct(rectangle, "stroke"), "width")[1]':
                  '_required_direct(_required_direct(rectangle, "stroke"), "width")[1]',
              'root_child_uuid = str(_direct(root_sheet, "uuid")[1])':
                  'root_child_uuid = str(_required_direct(root_sheet, "uuid")[1])',
              'str(_direct(_direct(root_tree, "sheet_instances"), "path")[1])':
                  'str(_required_direct(_required_direct(root_tree, "sheet_instances"), "path")[1])',
              'leaf_uuid = str(_direct(child_sheet, "uuid")[1])':
                  'leaf_uuid = str(_required_direct(child_sheet, "uuid")[1])',
              'str(_direct(_direct(child_tree, "sheet_instances"), "path")[1])':
                  'str(_required_direct(_required_direct(child_tree, "sheet_instances"), "path")[1])',
              'str(_direct(_direct(leaf_tree, "sheet_instances"), "path")[1])':
                  'str(_required_direct(_required_direct(leaf_tree, "sheet_instances"), "path")[1])',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          if "_required_direct(" not in source or "build_project_symbol_catalog" not in source:
              raise SystemExit("The merged extraction test lost typed access or main catalog coverage.")
          extraction.write_text(source, encoding="utf-8")

          main_plugin = Path(".git")  # only a marker so this script stays independent of shell quoting
          plugin_path = Path("plugin/kicad-blocks/kicad_blocks/plugin.py")
          plugin_text = plugin_path.read_text(encoding="utf-8")
          import os
          import subprocess
          main_text = subprocess.run(
              ["git", "show", "origin/main:plugin/kicad-blocks/kicad_blocks/plugin.py"],
              check=True, capture_output=True, text=True,
          ).stdout
          def contract_ids(text: str) -> set[str]:
              return set(re.findall(r"""contract_id\s*=\s*["']([^"']+)["']""", text)) | set(
                  re.findall(r"""_kicad_ui_contract_id\s*=\s*["']([^"']+)["']""", text)
              )
          missing = sorted(contract_ids(main_text) - contract_ids(plugin_text))
          Path(os.environ["RUNNER_TEMP"], "missing-main-contract-ids.txt").write_text(
              "\n".join(missing) + ("\n" if missing else ""), encoding="utf-8"
          )
          PY
            # Keep the workflow file identical to the checked-out PR head so
            # GITHUB_TOKEN only needs contents:write to push the merge commit.
            git checkout HEAD -- .github/workflows/ci.yml
            git add docs/explanation/compatibility.md tests/test_extraction.py
            git add -u
            git commit -m "merge: synchronize strict quality PR with current main"
            git push origin "HEAD:refs/heads/$REF_NAME"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The PR branch now includes current main; CI will rerun on the merge commit."
            exit 0
          fi

          conflict_dir="${RUNNER_TEMP}/main-merge-conflicts"
          mkdir -p "$conflict_dir"
          git diff --name-only --diff-filter=U > "$conflict_dir/conflicts.txt"
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            target="$conflict_dir/files/$path"
            mkdir -p "$(dirname "$target")"
            for stage in 1 2 3; do
              git show ":$stage:$path" > "$target.stage$stage" 2>/dev/null || true
            done
            git diff --cc -- "$path" > "$target.combined.diff" || true
          done < "$conflict_dir/conflicts.txt"
          git status --short > "$conflict_dir/git-status.txt"
          merge_base="$(git merge-base origin/main HEAD)"
          while IFS= read -r changed_path; do
            [[ -n "$changed_path" ]] || continue
            source_path="$PWD/$changed_path"
            [[ -f "$source_path" ]] || continue
            target_path="$conflict_dir/worktree/$changed_path"
            mkdir -p "$(dirname "$target_path")"
            cp "$source_path" "$target_path"
          done < <(git diff --name-only "$merge_base" origin/main)
          echo "::error::Git reported merge conflicts with current main. The full merge worktree and conflict stages were saved as an artifact."
          exit 1

      - name: Upload exact main merge conflict inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr40-main-merge-conflicts
          path: ${{ runner.temp }}/main-merge-conflicts
          if-no-files-found: ignore
          include-hidden-files: true
          compression-level: 1

  # Temporary single-use maintenance job. It deletes itself in the formatter commit.
  format-python-once:
    needs: synchronize-main
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: one-time Ruff format' && needs.synchronize-main.outputs.updated != 'true' && github.ref == 'refs/heads/agents/strict-test-quality-contract-rebased' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format the identified Python files with pinned Ruff
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check ruff==0.17.2
          python3 -m ruff format \
            plugin/kicad-blocks/kicad_blocks/plugin.py \
            tests/capture_visual_docs.py \
            tests/test_editor_workflow.py \
            tests/test_extraction.py \
            tests/test_library_and_pcb_manager_contracts.py \
            tests/test_library_browser_contracts.py \
            tests/test_native_tk_dialog_smoke.py \
            tests/test_plugin_registration.py \
            tests/test_ui_contracts.py \
            tests/test_uncovered_dialog_contracts.py
          python3 -m ruff format --check \
            plugin/kicad-blocks/kicad_blocks/plugin.py \
            tests/capture_visual_docs.py \
            tests/test_editor_workflow.py \
            tests/test_extraction.py \
            tests/test_library_and_pcb_manager_contracts.py \
            tests/test_library_browser_contracts.py \
            tests/test_native_tk_dialog_smoke.py \
            tests/test_plugin_registration.py \
            tests/test_ui_contracts.py \
            tests/test_uncovered_dialog_contracts.py
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          start = lines.index("  # Temporary single-use maintenance job. It deletes itself in the formatter commit.")
          end = lines.index("  python-and-kicad:", start)
          path.write_text("\n".join(lines[:start] + lines[end:]) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            plugin/kicad-blocks/kicad_blocks/plugin.py \
            tests/capture_visual_docs.py \
            tests/test_editor_workflow.py \
            tests/test_extraction.py \
            tests/test_library_and_pcb_manager_contracts.py \
            tests/test_library_browser_contracts.py \
            tests/test_native_tk_dialog_smoke.py \
            tests/test_plugin_registration.py \
            tests/test_ui_contracts.py \
            tests/test_uncovered_dialog_contracts.py
          git commit -m "style: format tracked Python with Ruff 0.17.2"
          git push origin "$GITHUB_REF"
  python-and-kicad:
    needs: synchronize-main
    if: ${{ needs.synchronize-main.outputs.updated != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install KiCad development CLI if missing
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the development build because the plugin targets the newer
          # KiCad schematic IPC API. Install it into the ephemeral GitHub runner.
          CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          if [[ -z "$CLI" ]]; then
            if [[ "$(id -u)" -eq 0 ]]; then
              SUDO=()
            elif command -v sudo >/dev/null 2>&1 && sudo -n true; then
              SUDO=(sudo)
            else
              echo "::error::KiCad CLI installation failed on the GitHub-hosted runner."
              exit 1
            fi
            apt_with_retry() {
              local timeout_seconds="$1"
              shift
              local attempt=1
              until timeout --kill-after=15s "${timeout_seconds}s" "${SUDO[@]}" apt-get \
                -o Acquire::Retries=1 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 "$@"; do
                if (( attempt >= 4 )); then
                  echo "::error::apt-get $* failed after ${attempt} bounded attempts."
                  return 1
                fi
                local delay=$(( 5 * 2 ** (attempt - 1) ))
                echo "::warning::apt-get $* failed or timed out; retrying in ${delay}s (attempt ${attempt}/4)."
                sleep "$delay"
                attempt=$(( attempt + 1 ))
              done
            }
            apt_with_retry 180 update
            apt_with_retry 180 install -y --no-install-recommends software-properties-common
            ppa_added=false
            for attempt in 1 2 3 4; do
              if timeout --kill-after=15s 120s "${SUDO[@]}" add-apt-repository --yes ppa:kicad/kicad-dev-nightly; then
                ppa_added=true
                break
              fi
              if [[ "$attempt" -lt 4 ]]; then
                delay=$(( 5 * 2 ** (attempt - 1) ))
                echo "::warning::Launchpad PPA lookup failed; retrying in ${delay}s (attempt ${attempt}/4)."
                sleep "$delay"
              fi
            done
            if [[ "$ppa_added" != true ]]; then
              echo "::error::Could not reach Launchpad to add the KiCad nightly PPA after 4 bounded attempts."
              exit 1
            fi
            apt_with_retry 180 update
            apt_with_retry 600 install -y --no-install-recommends kicad-nightly
            CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          fi
          if [[ -z "$CLI" ]]; then
            echo "::error::KiCad CLI package installed but no kicad-cli executable was found."
            exit 1
          fi
          echo "KICAD_CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" version

      - name: Fetch pinned official KiCad symbol definitions
        shell: bash
        run: |
          set -euo pipefail
          SYMBOLS_DIR="${RUNNER_TEMP}/kicad-symbols"
          SYMBOLS_REF="$(tr -d '[:space:]' < examples/stusb4500/kicad-symbols.lock)"
          mkdir -p "$SYMBOLS_DIR"
          git -C "$SYMBOLS_DIR" init
          git -C "$SYMBOLS_DIR" remote add origin https://gitlab.com/kicad/libraries/kicad-symbols.git
          git -C "$SYMBOLS_DIR" config core.sparseCheckout true
          cat > "$SYMBOLS_DIR/.git/info/sparse-checkout" <<'EOF'
          /Interface_USB.kicad_symdir/STUSB4500QTR.kicad_sym
          /Connector.kicad_symdir/USB_C_Receptacle.kicad_sym
          /Connector_Generic.kicad_symdir/Conn_01x02.kicad_sym
          /Connector_Generic.kicad_symdir/Conn_01x06.kicad_sym
          /Device.kicad_symdir/C.kicad_sym
          /Device.kicad_symdir/R.kicad_sym
          /Device.kicad_symdir/D.kicad_sym
          /Device.kicad_symdir/D_TVS.kicad_sym
          /Transistor_FET.kicad_symdir/Q_PMOS_GSD.kicad_sym
          EOF
          git -C "$SYMBOLS_DIR" fetch --depth 1 origin "$SYMBOLS_REF"
          git -C "$SYMBOLS_DIR" checkout --detach FETCH_HEAD
          test -f "$SYMBOLS_DIR/Interface_USB.kicad_symdir/STUSB4500QTR.kicad_sym"
          echo "KICAD_SYMBOL_DIR=$SYMBOLS_DIR" >> "$GITHUB_ENV"

      - name: Inspect GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: $(uname -a)"
          python3 --version
          echo "KiCad CLI: $KICAD_CLI"
          echo "Persistent tool cache: ${RUNNER_TOOL_CACHE:-not-set}"

      - name: Resolve pinned KiCad Python IPC binding revision
        id: kipy
        shell: bash
        run: |
          set -euo pipefail
          KIPY_SHA="$(tr -d '\r\n' < plugin/kicad-blocks/kicad-python.lock)"
          if [[ ! "$KIPY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::plugin/kicad-blocks/kicad-python.lock must contain one 40-character lowercase commit SHA."
            exit 1
          fi
          echo "sha=$KIPY_SHA" >> "$GITHUB_OUTPUT"
          echo "Using pinned kicad-python commit $KIPY_SHA"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/kicad-blocks-venv"
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements-dev.txt
          "$PY" --version
          "$PY" -m pip --version

      - name: Restore cached KiCad Python IPC wheels
        id: kipy-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kicad-blocks-wheelhouse
          key: kicad-python-${{ runner.os }}-${{ runner.arch }}-py312-${{ steps.kipy.outputs.sha }}

      - name: Reuse or build CPython 3.12 KiCad Python IPC wheel
        id: kipy-wheel
        shell: bash
        env:
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse"
          EXPECTED="kicad_python-0.9.0.dev0-cp312-cp312-linux_x86_64.whl"
          mkdir -p "$WHEELHOUSE"
          if [[ ! -s "$WHEELHOUSE/$EXPECTED" ]]; then
            set +e
            python3 scripts/download_pinned_ipc_wheel.py "$WHEELHOUSE" \
              --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
            DOWNLOAD_STATUS=$?
            set -e
            if [[ "$DOWNLOAD_STATUS" -eq 3 ]]; then
              echo "No published CPython 3.12 wheel for $KIPY_SHA; building it from source."
              rm -f "$WHEELHOUSE"/kicad_python-*.whl
              "$PY" -m pip wheel --wheel-dir "$WHEELHOUSE" \
                "git+https://gitlab.com/kicad/code/kicad-python.git@$KIPY_SHA"
            elif [[ "$DOWNLOAD_STATUS" -ne 0 ]]; then
              exit "$DOWNLOAD_STATUS"
            fi
          else
            echo "Reusing exact pinned CPython 3.12 wheel from the Actions cache."
          fi
          test -s "$WHEELHOUSE/$EXPECTED"
          du -sh "$WHEELHOUSE"

      - name: Publish immutable KiCad Python IPC dependency wheel
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/publish_pinned_ipc_wheel.py \
            "${RUNNER_TEMP}/kicad-blocks-wheelhouse" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-sha "$KIPY_SHA"

      - name: Save KiCad Python IPC wheel cache
        if: steps.kipy-wheel.outcome == 'success' && steps.kipy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kicad-blocks-wheelhouse
          key: kicad-python-${{ runner.os }}-${{ runner.arch }}-py312-${{ steps.kipy.outputs.sha }}

      - name: Install KiCad Python IPC bindings
        shell: bash
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse"
          "$PY" -m pip install "$WHEELHOUSE/kicad_python-0.9.0.dev0-cp312-cp312-linux_x86_64.whl"
          "$PY" -c "from kipy import KiCad; from kipy.schematic import Schematic; print('Schematic IPC bindings available')"

      - name: Run unit tests and compile
        shell: bash
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          "$PY" -m pytest -q
          "$PY" -m compileall -q plugin tests scripts

      - name: Strict Python quality contract
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${RUNNER_TEMP}/kicad-blocks-venv/bin:$PATH"
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          "$PY" scripts/check_python_quality.py
          "$PY" scripts/test_inventory.py --check
          "$PY" scripts/check_test_quality.py
          "$PY" scripts/check_ruff_quality.py
          mapfile -d '' TRACKED_PYTHON < <(git ls-files -z -- '*.py' '*.pyi')
          if (("${#TRACKED_PYTHON[@]}")); then
            "$PY" -m ruff format --check "${TRACKED_PYTHON[@]}"
          fi
          "$PY" -m pyright -p pyrightconfig.json --pythonpath "$PY"
          ty check plugin/kicad-blocks
          vulture --min-confidence 100 plugin/kicad-blocks/kicad_blocks scripts

      - name: Validate documentation links and images
        shell: bash
        run: python3 scripts/validate_docs.py

      - name: Verify generated UI screen inventory
        shell: bash
        run: python3 scripts/generate_ui_inventory.py --check

      - name: Validate generated files with KiCad
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/validate_kicad_cli.py"

      - name: Install virtual-display GUI test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1 \
            || ! command -v xdotool >/dev/null 2>&1 \
            || ! command -v xwd >/dev/null 2>&1 \
            || ! python3 -c "import tkinter" >/dev/null 2>&1; then
            if [[ "$(id -u)" -eq 0 ]]; then
              apt-get update
              apt-get install -y --no-install-recommends xvfb xdotool python3-tk x11-apps
            else
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends xvfb xdotool python3-tk x11-apps
            fi
          fi
          python3 -c "import tkinter; print('System Python Tkinter available')"
          EESCHEMA="$(command -v eeschema-nightly || command -v eeschema || true)"
          if [[ -z "$EESCHEMA" ]]; then
            echo "::error::KiCad Eeschema executable was not installed with the nightly package."
            exit 1
          fi
          echo "KICAD_EESCHEMA=$EESCHEMA" >> "$GITHUB_ENV"
          xvfb-run --help >/dev/null
          command -v xdotool

      - name: Verify Create Block from Sheet against real KiCad IPC
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv/bin/python" tests/create_block_ipc_integration.py

      - name: Verify Eeschema GUI editor launch and save
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv/bin/python" tests/test_eeschema_gui.py

      - name: Verify native-rendered functional block picker
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv/bin/python" tests/test_library_picker_gui.py
      - name: Generate real KiCad visual documentation previews
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/kicad-blocks-visual-docs"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv/bin/python" tests/capture_visual_docs.py \
            --output-dir "$OUT"

      - name: Upload generated visual documentation bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kicad-blocks-visual-docs
          path: ${{ runner.temp }}/kicad-blocks-visual-docs
          if-no-files-found: warn
          compression-level: 1

      - name: Assemble generated UI window inventory and screenshots
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="${RUNNER_TEMP}/kicad-blocks-visual-docs"
          OUT="${RUNNER_TEMP}/kicad-blocks-ui-inventory"
          mkdir -p "$OUT"
          cp docs/ui-inventory.md "$OUT/"
          shopt -s nullglob
          screenshots=("$SOURCE"/*.png "$SOURCE"/*.gif)
          if [[ ${#screenshots[@]} -eq 0 ]]; then
            echo "::error::Visual screenshot capture produced no files for the UI inventory artifact."
            exit 1
          fi
          cp "${screenshots[@]}" "$OUT/"
          printf 'Included %s visual assets with docs/ui-inventory.md\n' "${#screenshots[@]}"

      - name: Upload UI screen inventory and screenshot bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kicad-blocks-ui-screen-inventory
          path: ${{ runner.temp }}/kicad-blocks-ui-inventory
          if-no-files-found: warn
          compression-level: 1


      - name: Verify KiCad plugin discovery and managed environment
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv/bin/python" tests/test_plugin_registration.py

      - name: Upload Edit Facade GUI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edit-facade-gui-diagnostics
          path: ${{ runner.temp }}/edit-facade-gui-debug.xwd
          if-no-files-found: ignore
          compression-level: 1

      - name: Verify real KiCad IPC placement (headless)
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/test_ipc_headless.py"

      - name: Verify PCB IPC primitives (headless)
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/test_pcb_ipc.py"

      - name: Verify PCB block layout merge (headless)
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/test_pcb_layout.py"

      # Build each ABI-specific dependency wheel with that exact interpreter.
      # KiCad's plugin manager installs wheels only, so publish a prebuilt
      # kicad-python wheel and its matching dependencies for every supported ABI.
      - name: Set up CPython 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reuse or build CPython 3.13 KiCad IPC wheel
        shell: bash
        env:
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 --version
          VENV="${RUNNER_TEMP}/kicad-blocks-venv-cp313"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse-cp313"
          rm -rf "$VENV" "$WHEELHOUSE"
          mkdir -p "$WHEELHOUSE"
          python3 -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          EXPECTED="kicad_python-0.9.0.dev0-cp313-cp313-linux_x86_64.whl"
          set +e
          python3 scripts/download_pinned_ipc_wheel.py "$WHEELHOUSE" \
            --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
          DOWNLOAD_STATUS=$?
          set -e
          if [[ "$DOWNLOAD_STATUS" -eq 3 ]]; then
            echo "No published cp313 wheel for $KIPY_SHA; building it from source."
            "$PY" -m pip wheel --wheel-dir "$WHEELHOUSE" \
              "git+https://gitlab.com/kicad/code/kicad-python.git@$KIPY_SHA"
          elif [[ "$DOWNLOAD_STATUS" -ne 0 ]]; then
            exit "$DOWNLOAD_STATUS"
          fi
          test -s "$WHEELHOUSE/$EXPECTED"
          python3 scripts/publish_pinned_ipc_wheel.py \
            "$WHEELHOUSE" --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
          "$PY" -m pip install "$WHEELHOUSE/$EXPECTED"
          "$PY" -c "from kipy import KiCad; from kipy.schematic import Schematic; print('CPython 3.13 KiCad IPC bindings available')"

      - name: Verify KiCad plugin discovery on CPython 3.13
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv-cp313/bin/python" tests/test_plugin_registration.py

      - name: Set up CPython 3.14.4
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"

      - name: Reuse or build CPython 3.14 KiCad IPC wheel
        shell: bash
        env:
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 --version
          VENV="${RUNNER_TEMP}/kicad-blocks-venv-cp314"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse-cp314"
          rm -rf "$VENV" "$WHEELHOUSE"
          mkdir -p "$WHEELHOUSE"
          python3 -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          EXPECTED="kicad_python-0.9.0.dev0-cp314-cp314-linux_x86_64.whl"
          set +e
          python3 scripts/download_pinned_ipc_wheel.py "$WHEELHOUSE" \
            --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
          DOWNLOAD_STATUS=$?
          set -e
          if [[ "$DOWNLOAD_STATUS" -eq 3 ]]; then
            echo "No published cp314 wheel for $KIPY_SHA; building it from source."
            "$PY" -m pip wheel --wheel-dir "$WHEELHOUSE" \
              "git+https://gitlab.com/kicad/code/kicad-python.git@$KIPY_SHA"
          elif [[ "$DOWNLOAD_STATUS" -ne 0 ]]; then
            exit "$DOWNLOAD_STATUS"
          fi
          test -s "$WHEELHOUSE/$EXPECTED"
          python3 scripts/publish_pinned_ipc_wheel.py \
            "$WHEELHOUSE" --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
          "$PY" -m pip install "$WHEELHOUSE/$EXPECTED"
          "$PY" -c "from kipy import KiCad; from kipy.schematic import Schematic; print('CPython 3.14 KiCad IPC bindings available')"

      - name: Verify KiCad plugin discovery on CPython 3.14
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv-cp314/bin/python" tests/test_plugin_registration.py

      - name: Publish verified visual documentation previews
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/publish_visual_docs.py \
            --source-dir "${RUNNER_TEMP}/kicad-blocks-visual-docs" \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"

      # Release publication is deliberately after validation and best-effort:
      # a transient GitHub upload outage must not mask a green KiCad test suite.
      - name: Publish tested KiCad Python IPC wheel for user installs
        id: publish-wheel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/publish_ipc_wheel.py "${RUNNER_TEMP}/kicad-blocks-wheelhouse"

      # One-time V1 release tag. The workflow change itself is not part of V1:
      # this tag deliberately points at the verified feature merge commit.
      # Later main validations leave the immutable tag untouched.
      - name: Create immutable V1 tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TAG_TARGET_SHA: 0ea21877d681cb1d7fe8224996e022c6f4d86e4b
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs --tags origin refs/tags/v1 >/dev/null 2>&1; then
            git fetch --no-tags origin refs/tags/v1:refs/tags/v1
            existing_target="$(git rev-list -n 1 v1)"
            if [[ "$existing_target" != "$TAG_TARGET_SHA" ]]; then
              echo "::error::The existing v1 tag points to $existing_target, not $TAG_TARGET_SHA."
              exit 1
            fi
            echo "The immutable v1 tag already points to the expected commit."
            exit 0
          fi
          git fetch --no-tags origin "$TAG_TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1 "$TAG_TARGET_SHA" -m "KiCad Blocks v1"
          git push origin refs/tags/v1


  ui-interaction-contracts:
    # These tests exercise real Tk widgets and only stub KiCad/filesystem
    # boundaries. They do not need the KiCad CLI or a running editor.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Tk and virtual display
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb
          python3 -c "import tkinter; print('System Tkinter available')"
          xvfb-run -a -s "-screen 0 1280x800x24" python3 -c "import tkinter; root=tkinter.Tk(); root.destroy(); print('Xvfb Tk window creation works')"

      - name: Install plugin and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "${RUNNER_TEMP}/kicad-blocks-ui-venv"
          PY="${RUNNER_TEMP}/kicad-blocks-ui-venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r plugin/kicad-blocks/requirements.txt pytest
          "$PY" -c "from kipy import KiCad; import tkinter; print('Tk and KiCad IPC Python modules import')"

      - name: Execute and assert reusable Tk UI component contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-ui-venv/bin/python" -m pytest -vv -o faulthandler_timeout=30 tests/test_ui_contracts.py tests/test_library_browser_contracts.py tests/test_add_pcb_layout_contracts.py tests/test_implementation_manager_contracts.py

  visual-ui-audit:
    # Keep a separate hosted visual audit so screenshot evidence remains available
    # independently of the full live IPC integration job.
    needs: synchronize-main
    if: ${{ needs.synchronize-main.outputs.updated != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned official KiCad symbol definitions
        shell: bash
        run: |
          set -euo pipefail
          SYMBOLS_DIR="${RUNNER_TEMP}/kicad-symbols"
          SYMBOLS_REF="$(tr -d '[:space:]' < examples/stusb4500/kicad-symbols.lock)"
          mkdir -p "$SYMBOLS_DIR"
          git -C "$SYMBOLS_DIR" init
          git -C "$SYMBOLS_DIR" remote add origin https://gitlab.com/kicad/libraries/kicad-symbols.git
          git -C "$SYMBOLS_DIR" config core.sparseCheckout true
          cat > "$SYMBOLS_DIR/.git/info/sparse-checkout" <<'EOF'
          /Interface_USB.kicad_symdir/STUSB4500QTR.kicad_sym
          /Connector.kicad_symdir/USB_C_Receptacle.kicad_sym
          /Connector_Generic.kicad_symdir/Conn_01x02.kicad_sym
          /Connector_Generic.kicad_symdir/Conn_01x06.kicad_sym
          /Device.kicad_symdir/C.kicad_sym
          /Device.kicad_symdir/R.kicad_sym
          /Device.kicad_symdir/D.kicad_sym
          /Device.kicad_symdir/D_TVS.kicad_sym
          /Transistor_FET.kicad_symdir/Q_PMOS_GSD.kicad_sym
          EOF
          git -C "$SYMBOLS_DIR" fetch --depth 1 origin "$SYMBOLS_REF"
          git -C "$SYMBOLS_DIR" checkout --detach FETCH_HEAD
          test -f "$SYMBOLS_DIR/Interface_USB.kicad_symdir/STUSB4500QTR.kicad_sym"
          echo "KICAD_SYMBOL_DIR=$SYMBOLS_DIR" >> "$GITHUB_ENV"

      - name: Install KiCad nightly and virtual display
        shell: bash
        run: |
          set -euo pipefail
          apt_with_retry() {
            local timeout_seconds="$1"
            shift
            local attempt=1
            until timeout --kill-after=15s "${timeout_seconds}s" sudo apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 "$@"; do
              if (( attempt >= 4 )); then
                echo "::error::apt-get $* failed after ${attempt} bounded attempts."
                return 1
              fi
              delay=$(( 5 * 2 ** (attempt - 1) ))
              echo "::warning::apt-get $* failed or timed out; retrying in ${delay}s (attempt ${attempt}/4)."
              sleep "$delay"
              attempt=$(( attempt + 1 ))
            done
          }
          apt_with_retry 180 update
          apt_with_retry 180 install -y --no-install-recommends software-properties-common xvfb xdotool python3-tk
          attempt=1
          until timeout --kill-after=15s 120s sudo add-apt-repository --yes ppa:kicad/kicad-dev-nightly; do
            if (( attempt >= 4 )); then
              echo "::error::Unable to query the KiCad nightly PPA through Launchpad after ${attempt} attempts."
              exit 1
            fi
            delay=$(( 5 * 2 ** (attempt - 1) ))
            echo "::warning::Launchpad returned an incomplete PPA response; retrying in ${delay}s (attempt ${attempt}/4)."
            sleep "$delay"
            attempt=$(( attempt + 1 ))
          done
          apt_with_retry 180 update
          attempt=1
          until timeout --kill-after=15s 600s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends kicad-nightly; do
            if (( attempt >= 4 )); then
              echo "::error::Unable to download the KiCad nightly packages after ${attempt} install attempts."
              exit 1
            fi
            delay=$(( 5 * 2 ** (attempt - 1) ))
            echo "::warning::KiCad nightly package fetch failed; retrying in ${delay}s (attempt ${attempt}/4)."
            sleep "$delay"
            apt_with_retry 180 update
            attempt=$(( attempt + 1 ))
          done
          CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          if [[ -z "$CLI" ]]; then
            echo "::error::KiCad CLI was not installed."
            exit 1
          fi
          echo "KICAD_CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" version
          command -v xdotool
          python3 -c "import tkinter; print('Tkinter available')"

      - name: Install visual capture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/kicad-blocks-visual-venv"
          PY="${RUNNER_TEMP}/kicad-blocks-visual-venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install cairosvg pillow

      - name: Install project dependencies and verify unit tests, compile, and lint
        shell: bash
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-visual-venv/bin/python"
          "$PY" -m pip install -r requirements-dev.txt -r plugin/kicad-blocks/requirements.txt
          "$PY" -m pytest -q
          "$PY" -m compileall -q plugin tests scripts
          "$PY" scripts/check_ruff_quality.py

      - name: Validate generated reference files with KiCad CLI
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/kicad-blocks-visual-venv/bin/python" tests/validate_kicad_cli.py

      - name: Capture production KiCad Blocks UI in light and dark themes
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/kicad-blocks-visual-ui-audit"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            "${RUNNER_TEMP}/kicad-blocks-visual-venv/bin/python" tests/capture_visual_docs.py \
            --output-dir "$OUT"

      - name: Upload visual UI audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kicad-blocks-visual-ui-audit
          path: ${{ runner.temp }}/kicad-blocks-visual-ui-audit
          if-no-files-found: error
          compression-level: 1
