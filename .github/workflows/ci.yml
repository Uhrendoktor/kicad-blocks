name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest pending validation for each ref. This runner is local
# and serial; stale commit snapshots must not build an unbounded queue.
concurrency:
  group: kicad-blocks-${{ github.ref }}
  cancel-in-progress: true

# The runner is owned by the repository maintainer. Do not execute fork PR code
# on it: only pull requests whose head branch is in this repository are eligible.
jobs:
  python-and-kicad:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad development CLI if missing
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the development build because the plugin targets the newer
          # KiCad schematic IPC API. It is installed inside the self-hosted
          # runner container, not on a GitHub-hosted VM.
          CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          if [[ -z "$CLI" ]]; then
            if [[ "$(id -u)" -eq 0 ]]; then
              SUDO=()
            elif command -v sudo >/dev/null 2>&1 && sudo -n true; then
              SUDO=(sudo)
            else
              echo "::error::KiCad CLI is missing and this self-hosted runner has no non-interactive package-install privilege. Install kicad-nightly on the runner image or grant the runner container package-install access."
              exit 1
            fi
            "${SUDO[@]}" apt-get update
            "${SUDO[@]}" apt-get install -y --no-install-recommends software-properties-common
            "${SUDO[@]}" add-apt-repository --yes ppa:kicad/kicad-dev-nightly
            "${SUDO[@]}" apt-get update
            "${SUDO[@]}" apt-get install -y --no-install-recommends kicad-nightly
            CLI="$(command -v kicad-cli-nightly || command -v kicad-cli || true)"
          fi
          if [[ -z "$CLI" ]]; then
            echo "::error::KiCad CLI package installed but no kicad-cli executable was found."
            exit 1
          fi
          echo "KICAD_CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" version

      - name: Inspect local runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: $(uname -a)"
          python3 --version
          echo "KiCad CLI: $KICAD_CLI"
          echo "Persistent tool cache: ${RUNNER_TOOL_CACHE:-not-set}"

      - name: Resolve pinned KiCad Python IPC binding revision
        id: kipy
        shell: bash
        run: |
          set -euo pipefail
          KIPY_SHA="$(tr -d '\r\n' < plugin/kicad-blocks/kicad-python.lock)"
          if [[ ! "$KIPY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::plugin/kicad-blocks/kicad-python.lock must contain one 40-character lowercase commit SHA."
            exit 1
          fi
          echo "sha=$KIPY_SHA" >> "$GITHUB_OUTPUT"
          echo "Using pinned kicad-python commit $KIPY_SHA"

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/kicad-blocks-venv"
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install pytest ruff cairosvg
          "$PY" --version
          "$PY" -m pip --version

      - name: Restore cached KiCad Python IPC wheels
        id: kipy-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kicad-blocks-wheelhouse
          key: kicad-python-${{ runner.os }}-${{ runner.arch }}-py312-${{ steps.kipy.outputs.sha }}

      - name: Reuse or build CPython 3.12 KiCad Python IPC wheel
        id: kipy-wheel
        shell: bash
        env:
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse"
          EXPECTED="kicad_python-0.9.0.dev0-cp312-cp312-linux_x86_64.whl"
          mkdir -p "$WHEELHOUSE"
          if [[ ! -s "$WHEELHOUSE/$EXPECTED" ]]; then
            set +e
            python3 scripts/download_pinned_ipc_wheel.py "$WHEELHOUSE" \
              --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
            DOWNLOAD_STATUS=$?
            set -e
            if [[ "$DOWNLOAD_STATUS" -eq 3 ]]; then
              echo "No published CPython 3.12 wheel for $KIPY_SHA; building it from source."
              rm -f "$WHEELHOUSE"/kicad_python-*.whl
              "$PY" -m pip wheel --wheel-dir "$WHEELHOUSE" \
                "git+https://gitlab.com/kicad/code/kicad-python.git@$KIPY_SHA"
            elif [[ "$DOWNLOAD_STATUS" -ne 0 ]]; then
              exit "$DOWNLOAD_STATUS"
            fi
          else
            echo "Reusing exact pinned CPython 3.12 wheel from the Actions cache."
          fi
          test -s "$WHEELHOUSE/$EXPECTED"
          du -sh "$WHEELHOUSE"

      - name: Publish immutable KiCad Python IPC dependency wheel
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/publish_pinned_ipc_wheel.py \
            "${RUNNER_TEMP}/kicad-blocks-wheelhouse" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-sha "$KIPY_SHA"

      - name: Save KiCad Python IPC wheel cache
        if: steps.kipy-wheel.outcome == 'success' && steps.kipy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kicad-blocks-wheelhouse
          key: kicad-python-${{ runner.os }}-${{ runner.arch }}-py312-${{ steps.kipy.outputs.sha }}

      - name: Install KiCad Python IPC bindings
        shell: bash
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse"
          "$PY" -m pip install "$WHEELHOUSE/kicad_python-0.9.0.dev0-cp312-cp312-linux_x86_64.whl"
          "$PY" -c "from kipy import KiCad; from kipy.schematic import Schematic; print('Schematic IPC bindings available')"

      - name: Run unit tests and compile
        shell: bash
        run: |
          set -euo pipefail
          PY="${RUNNER_TEMP}/kicad-blocks-venv/bin/python"
          "$PY" -m pytest -q
          "$PY" -m compileall -q plugin tests

      - name: Ruff lint
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python -m ruff check plugin tests"

      - name: Validate generated files with KiCad
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/validate_kicad_cli.py"

      - name: Install virtual-display GUI test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1 \
            || ! command -v xdotool >/dev/null 2>&1 \
            || ! python3 -c "import tkinter" >/dev/null 2>&1; then
            if [[ "$(id -u)" -eq 0 ]]; then
              apt-get update
              apt-get install -y --no-install-recommends xvfb xdotool python3-tk
            else
              sudo -n apt-get update
              sudo -n apt-get install -y --no-install-recommends xvfb xdotool python3-tk
            fi
          fi
          python3 -c "import tkinter; print('System Python Tkinter available')"
          EESCHEMA="$(command -v eeschema-nightly || command -v eeschema || true)"
          if [[ -z "$EESCHEMA" ]]; then
            echo "::error::KiCad Eeschema executable was not installed with the nightly package."
            exit 1
          fi
          echo "KICAD_EESCHEMA=$EESCHEMA" >> "$GITHUB_ENV"
          xvfb-run --help >/dev/null
          command -v xdotool

      - name: Verify Eeschema GUI editor launch and save
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv/bin/python" tests/test_eeschema_gui.py

      - name: Verify native-rendered functional block picker
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv/bin/python" tests/test_library_picker_gui.py

      - name: Verify KiCad plugin discovery and managed environment
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv/bin/python" tests/test_plugin_registration.py

      - name: Verify real KiCad IPC placement (headless)
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/test_ipc_headless.py"

      - name: Verify PCB IPC primitives (headless)
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/test_pcb_ipc.py"

      - name: Verify PCB block layout merge (headless)
        shell: bash
        run: "${RUNNER_TEMP}/kicad-blocks-venv/bin/python tests/test_pcb_layout.py"

      # Build each ABI-specific dependency wheel with that exact interpreter.
      # KiCad's plugin manager installs wheels only, so publish a prebuilt
      # kicad-python wheel and its matching dependencies for every supported ABI.
      - name: Set up CPython 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reuse or build CPython 3.13 KiCad IPC wheel
        shell: bash
        env:
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 --version
          VENV="${RUNNER_TEMP}/kicad-blocks-venv-cp313"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse-cp313"
          rm -rf "$VENV" "$WHEELHOUSE"
          mkdir -p "$WHEELHOUSE"
          python3 -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          EXPECTED="kicad_python-0.9.0.dev0-cp313-cp313-linux_x86_64.whl"
          set +e
          python3 scripts/download_pinned_ipc_wheel.py "$WHEELHOUSE" \
            --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
          DOWNLOAD_STATUS=$?
          set -e
          if [[ "$DOWNLOAD_STATUS" -eq 3 ]]; then
            echo "No published cp313 wheel for $KIPY_SHA; building it from source."
            "$PY" -m pip wheel --wheel-dir "$WHEELHOUSE" \
              "git+https://gitlab.com/kicad/code/kicad-python.git@$KIPY_SHA"
          elif [[ "$DOWNLOAD_STATUS" -ne 0 ]]; then
            exit "$DOWNLOAD_STATUS"
          fi
          test -s "$WHEELHOUSE/$EXPECTED"
          python3 scripts/publish_pinned_ipc_wheel.py \
            "$WHEELHOUSE" --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
          "$PY" -m pip install "$WHEELHOUSE/$EXPECTED"
          "$PY" -c "from kipy import KiCad; from kipy.schematic import Schematic; print('CPython 3.13 KiCad IPC bindings available')"

      - name: Verify KiCad plugin discovery on CPython 3.13
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv-cp313/bin/python" tests/test_plugin_registration.py

      - name: Set up CPython 3.14.4
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"

      - name: Reuse or build CPython 3.14 KiCad IPC wheel
        shell: bash
        env:
          KIPY_SHA: ${{ steps.kipy.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 --version
          VENV="${RUNNER_TEMP}/kicad-blocks-venv-cp314"
          WHEELHOUSE="${RUNNER_TEMP}/kicad-blocks-wheelhouse-cp314"
          rm -rf "$VENV" "$WHEELHOUSE"
          mkdir -p "$WHEELHOUSE"
          python3 -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          EXPECTED="kicad_python-0.9.0.dev0-cp314-cp314-linux_x86_64.whl"
          set +e
          python3 scripts/download_pinned_ipc_wheel.py "$WHEELHOUSE" \
            --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
          DOWNLOAD_STATUS=$?
          set -e
          if [[ "$DOWNLOAD_STATUS" -eq 3 ]]; then
            echo "No published cp314 wheel for $KIPY_SHA; building it from source."
            "$PY" -m pip wheel --wheel-dir "$WHEELHOUSE" \
              "git+https://gitlab.com/kicad/code/kicad-python.git@$KIPY_SHA"
          elif [[ "$DOWNLOAD_STATUS" -ne 0 ]]; then
            exit "$DOWNLOAD_STATUS"
          fi
          test -s "$WHEELHOUSE/$EXPECTED"
          python3 scripts/publish_pinned_ipc_wheel.py \
            "$WHEELHOUSE" --repo "$GITHUB_REPOSITORY" --source-sha "$KIPY_SHA"
          "$PY" -m pip install "$WHEELHOUSE/$EXPECTED"
          "$PY" -c "from kipy import KiCad; from kipy.schematic import Schematic; print('CPython 3.14 KiCad IPC bindings available')"

      - name: Verify KiCad plugin discovery on CPython 3.14
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            "${RUNNER_TEMP}/kicad-blocks-venv-cp314/bin/python" tests/test_plugin_registration.py

      # Release publication is deliberately after validation and best-effort:
      # a transient GitHub upload outage must not mask a green KiCad test suite.
      - name: Publish tested KiCad Python IPC wheel for user installs
        id: publish-wheel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/publish_ipc_wheel.py "${RUNNER_TEMP}/kicad-blocks-wheelhouse"

      # One-time V1 release tag. The workflow change itself is not part of V1:
      # this tag deliberately points at the verified feature merge commit.
      # Later main validations leave the immutable tag untouched.
      - name: Create immutable V1 tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TAG_TARGET_SHA: 0ea21877d681cb1d7fe8224996e022c6f4d86e4b
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs --tags origin refs/tags/v1 >/dev/null 2>&1; then
            git fetch --no-tags origin refs/tags/v1:refs/tags/v1
            existing_target="$(git rev-list -n 1 v1)"
            if [[ "$existing_target" != "$TAG_TARGET_SHA" ]]; then
              echo "::error::The existing v1 tag points to $existing_target, not $TAG_TARGET_SHA."
              exit 1
            fi
            echo "The immutable v1 tag already points to the expected commit."
            exit 0
          fi
          git fetch --no-tags origin "$TAG_TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1 "$TAG_TARGET_SHA" -m "KiCad Blocks v1"
          git push origin refs/tags/v1
