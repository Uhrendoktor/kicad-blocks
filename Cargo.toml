
[workspace]
resolver = "2"
members = [
    "crates/kicad-clippy-core",
    "crates/kicad-clippy-parser",
    "crates/kicad-clippy-erc",
    "crates/kicad-clippy-cli",
]
default-members = ["crates/kicad-clippy-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Uhrendoktor/kicad-blocks"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
kiutils_sexpr = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
