[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
required-version = "==0.17.2"
target-version = "py312"
line-length = 100
respect-gitignore = true
force-exclude = false

[tool.ruff.lint]
# Full rule selection with narrowly documented compatibility exceptions.
select = ["ALL"]
preview = true
ignore = [
  # Formatter conflicts and mutually exclusive docstring conventions.
  "COM812",
  "COM819",
  "D203",
  "D206",
  "D213",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "W191",

  # Stable importable module names and required lazy imports at host boundaries.
  "N999",
  "PLC0415",

  # Compatibility for host callbacks and long-lived console/status formatting.
  "PLR6301",
  "UP031",
]

[tool.ruff.lint.per-file-ignores]
# Test assertions, literals and diagnostic output are deliberate test oracles.
"tests/**/*.py" = ["S101", "PLR2004", "T201"]

# Stable command output is consumed by CI and release tooling.
"scripts/check_python_quality.py" = ["T201"]
"scripts/check_test_quality.py" = ["T201"]
"scripts/test_inventory.py" = ["T201"]
"scripts/verify_release_gate.py" = ["T201"]
"scripts/validate_docs.py" = ["T201"]

# These entry points and test scripts prepend their checkout/plugin root before importing it.
"plugin/kicad-blocks/entrypoints/action_hub.py" = ["E402"]
"plugin/kicad-blocks/entrypoints/browse_blocks.py" = ["E402"]
"plugin/kicad-blocks/entrypoints/create_block.py" = ["E402"]
"plugin/kicad-blocks/entrypoints/open_implementation.py" = ["E402"]
"scripts/validate_schematic_style.py" = ["E402"]
"examples/stusb4500/generate_reference.py" = ["E402"]
"tests/test_schematic_style_rules.py" = ["E402"]
"tests/test_variants.py" = ["E402"]
"tests/test_profiles.py" = ["E402"]
"tests/test_operations.py" = ["E402"]
"tests/test_library_validation.py" = ["E402"]
"tests/test_pcb_placement.py" = ["E402"]
"tests/test_library_picker_gui.py" = ["E402"]
"tests/validate_kicad_cli.py" = ["E402"]
"tests/test_auto_dependencies.py" = ["E402"]
"tests/test_extraction.py" = ["E402"]
"tests/test_blocks.py" = ["E402"]
"tests/test_pcb_layout.py" = ["E402"]
"tests/test_pcb_layout_unit.py" = ["E402"]
"tests/test_eeschema_gui.py" = ["E402"]
"tests/test_ipc_headless.py" = ["E402"]
"tests/test_stusb4500_reference.py" = ["E402"]
"tests/test_editor_workflow.py" = ["E402"]
"tests/test_library_browser.py" = ["E402"]
"tests/create_block_ipc_integration.py" = ["E402"]
"tests/test_plugin_registration.py" = ["E402"]
"tests/test_instance_configuration_gui.py" = ["E402"]
"tests/capture_visual_docs.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
